name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  #This downloads the repository files into the GitHub Actions runner

      - name: Setup Pages
        uses: actions/configure-pages@v5 #This prepares the GitHub Pages environment for deployment

      - name: Upload website
        uses: actions/upload-pages-artifact@v3 #This uploads the website files as an artifact
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4 #Finally, GitHub deploys the uploaded website to GitHub Pages
